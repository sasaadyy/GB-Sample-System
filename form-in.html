<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Form Input IN</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    input:disabled, select:disabled {
      background-color: #e2e8f0 !important;
      color: #64748b !important;
      cursor: not-allowed !important;
      border: 1px solid #cbd5e1 !important;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Factory 1</h2>
    <a href="/dashboard.html">📊 Dashboard</a>
    <a href="/input-in.html" class="active">📥 Input IN</a>
    <a href="/input-out.html">📤 Input OUT</a>
    <a href="/report.html">📑 Report</a>
    <a href="/index.html" style="margin-top: auto;">🚪 Logout</a>
  </div>
  
  <div class="main-content">
    <div class="topbar">
      <h3>Form Tambah Data IN</h3>
      <a href="/input-in.html" class="btn btn-secondary btn-small">← Kembali ke Tabel</a>
    </div>
    
    <div class="container">
      <div class="card">
        <h3>Data IN</h3>
        
        <!-- INFO DOKUMEN -->
        <div class="grid-2">
          <!-- BARU: PIC -->
          <div class="form-row">
            <label>PIC</label>
            <select id="inPic">
              <option>Darijok</option><option>Mumuh</option><option>Angga</option>
              <option>Vera</option><option>Rian</option><option>Ayadi</option><option>Huda</option>
            </select>
          </div>
          <div class="form-row">
            <label>Tanggal</label>
            <input type="date" id="inDate" />
          </div>
        </div>
        <div class="form-row">
          <label>Kategori</label>
          <select id="inCat">
            <option value="Final Ball">Final Ball</option>
            <option value="Finish Ball">Finish Ball</option>
            <option value="Core Ball">Core Ball</option>
            <option value="Packaging">Packaging</option>
            <option value="Mold">Mold</option>
          </select>
        </div>

        <hr style="margin: 20px 0; border: 1px dashed #cbd5e1;">

        <!-- INPUT BARANG -->
        <div class="grid-2">
          <div class="form-row">
            <label>Part Name</label>
            <select id="inPartName" onchange="autoFillIN()">
              <option value="">-- Pilih Part Name --</option>
            </select>
          </div>
          <div class="form-row">
            <label>Part Number</label>
            <input type="text" id="inPartNo" disabled placeholder="Otomatis..." />
          </div>
        </div>

        <div class="grid-2">
          <div class="form-row">
            <label>Qty IN</label>
            <input type="number" id="inQty" min="1" />
          </div>
          <div class="form-row">
            <label>Unit</label>
            <input type="text" id="inUnit" disabled placeholder="Otomatis..." />
          </div>
        </div>

        <!-- Tombol Tambah ke Tabel Sementara -->
        <button class="btn btn-secondary" onclick="tambahBarangKeTabel()" style="margin-bottom: 20px;">+ Tambah ke Daftar</button>

        <!-- TABEL BARANG SEMENTARA -->
        <table id="tabelBarangSementara">
          <thead>
            <tr>
              <th>Part Name</th>
              <th>Part Number</th>
              <th>Qty IN</th>
              <th>Unit</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="listBarangBody">
            <tr><td colspan="5" style="text-align:center">Belum ada barang ditambahkan</td></tr>
          </tbody>
        </table>

        <hr style="margin: 20px 0; border: 1px solid #e2e8f0;">

        <!-- Tombol Simpan Semua -->
        <button class="btn btn-success" style="width: 100%; padding: 15px; font-size: 16px;" onclick="simpanSemuaIN()">
          💾 Simpan Semua Data IN
        </button>
      </div>
    </div>
  </div>

  <script src="/js/masterData.js"></script>
  <script>
    // Array untuk menampung barang sementara sebelum disave
    let daftarBarang = [];

    // 1. Isi Dropdown Part Name
    const partSel = document.getElementById('inPartName');
    MASTER_PARTS.forEach(p => {
      partSel.innerHTML += `<option value="${p.part_no}">${p.part_name}</option>`;
    });

    // 2. Set Tanggal Default Hari Ini
    document.getElementById('inDate').value = new Date().toISOString().slice(0,10);

    // 3. Auto-fill Part Number & Unit
    function autoFillIN() {
      const selectedPartNo = document.getElementById('inPartName').value;
      const partData = MASTER_PARTS.find(p => p.part_no === selectedPartNo);
      
      if (partData) {
        document.getElementById('inPartNo').value = partData.part_no;
        document.getElementById('inUnit').value = partData.unit; 
      } else {
        document.getElementById('inPartNo').value = '';
        document.getElementById('inUnit').value = '';
      }
    }

    // 4. Fungsi Tambah ke Tabel Sementara
    function tambahBarangKeTabel() {
      const partNo = document.getElementById('inPartName').value;
      const partData = MASTER_PARTS.find(p => p.part_no === partNo);
      const qty = Number(document.getElementById('inQty').value);

      if (!partData || qty <= 0) {
        return alert('Pilih Part Name dan isi Qty dengan benar!');
      }

      daftarBarang.push({
        category: document.getElementById('inCat').value,
        part_name: partData.part_name,
        part_no: partData.part_no,
        unit: partData.unit,
        qty: qty
      });

      renderTabelSementara();
      
      // Reset input barang
      document.getElementById('inPartName').value = '';
      document.getElementById('inPartNo').value = '';
      document.getElementById('inUnit').value = '';
      document.getElementById('inQty').value = '';
    }

    // 5. Render Tabel Sementara
    function renderTabelSementara() {
      const tbody = document.getElementById('listBarangBody');
      
      if (daftarBarang.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Belum ada barang ditambahkan</td></tr>';
        return;
      }

      tbody.innerHTML = daftarBarang.map((it, index) => `
        <tr>
          <td>${it.part_name}</td>
          <td>${it.part_no}</td>
          <td>${it.qty}</td>
          <td>${it.unit}</td>
          <td><button class="btn btn-danger btn-small" onclick="hapusBarangSementara(${index})">Hapus</button></td>
        </tr>
      `).join('');
    }

    function hapusBarangSementara(index) {
      daftarBarang.splice(index, 1);
      renderTabelSementara();
    }

    // 6. Fungsi Simpan Semua (Sekali Klik)
    function simpanSemuaIN() {
      const dateVal = document.getElementById('inDate').value;

      if (!dateVal) return alert('Tanggal wajib diisi!');
      if (daftarBarang.length === 0) return alert('Minimal tambahkan 1 barang ke daftar!');

      // --- LOGIKA GENERATE REQUEST NUMBER ---
      let allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
      
      let maxSeq = 0;
      allRequests.forEach(r => {
        if (r.type === 'IN' && r.tanggal === dateVal && r.request_no && r.request_no.startsWith('IN-I-')) {
          const parts = r.request_no.split('-');
          if (parts.length === 4) {
            const seq = parseInt(parts[3], 10);
            if (seq > maxSeq) maxSeq = seq;
          }
        }
      });

      const year = new Date(dateVal).getFullYear().toString().slice(-2);
      const nextSeq = String(maxSeq + 1).padStart(3, '0');
      const newReqNo = `IN-I-${year}-${nextSeq}`;
      // -----------------------------------------------------------

      const newDoc = {
        id: 'req-' + Date.now(),
        request_no: newReqNo, 
        type: 'IN',
        tanggal: dateVal,
        surindo_pic: document.getElementById('inPic').value,   // BARU
        items: daftarBarang, 
        created_at: new Date().toISOString()
      };

      allRequests.push(newDoc);
      localStorage.setItem('requests', JSON.stringify(allRequests));
      
      alert(`Data IN berhasil disimpan dengan No: ${newReqNo}`);
      window.location.href = '/input-in.html'; 
    }
  </script>
</body>
</html>
