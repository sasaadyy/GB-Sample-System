<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="sidebar">
    <h2>Factory Golf Ball 1</h2>
    <a href="/dashboard.html" class="active">📊 Dashboard</a>
    <a href="/input-in.html">📥 Input IN</a>
    <a href="/input-out.html">📤 Input OUT</a>
    <a href="/report.html">📑 Report</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h3 style="margin:0;">Dashboard Overview</h3>
      <div>Role: <strong>Admin</strong></div>
    </div>

    <div class="container">
      <!-- TOTAL STOK -->
      <h3>Total Stok Barang (Berdasarkan Kategori)</h3>
      <div class="grid-3" id="stockContainer">
        <!-- Diisi JS -->
      </div>

      <!-- RIWAYAT DOKUMEN -->
      <h3 style="margin-top: 30px;">Riwayat Dokumen</h3>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Req No</th>
              <th>Tipe</th>
              <th>Tanggal</th>
              <th>PIC / Supplier</th>
              <th>Status Approval</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const allRequests = JSON.parse(localStorage.getItem('requests') || '[]');

    // ================= 1. RENDER STOK =================
    const stockContainer = document.getElementById('stockContainer');
    const stockData = {}; 
    
    allRequests.forEach(r => {
      if (r.type === 'IN' && r.item) {
        stockData[r.category] = (stockData[r.category] || 0) + Number(r.item.qty);
      } else if (r.type === 'OUT' && r.status === 'approved' && r.items) {
        r.items.forEach(it => {
          if(it.category) {
            stockData[it.category] = (stockData[it.category] || 0) - Number(it.qty_out);
          }
        });
      }
    });

    if (Object.keys(stockData).length === 0) {
      stockContainer.innerHTML = '<div class="card" style="grid-column: 1/-1; text-align:center;">Belum ada data stok</div>';
    } else {
      for (const [cat, total] of Object.entries(stockData)) {
        stockContainer.innerHTML += `
          <div class="card">
            <div style="font-size: 13px; color: #64748b;">${cat}</div>
            <div style="font-size: 24px; font-weight: bold; color: #1e3a8a;">${total}</div>
          </div>
        `;
      }
    }

    // ================= 2. RENDER RIWAYAT =================
    // KETAT: Hanya tampilkan data yang sudah terkirim (Pending/Approved) dan ada request_no valid
    const validRequests = allRequests.filter(r => {
      // Abaikan jika tidak punya request_no yang benar
      if (!r.request_no) return false;
      
      // Abaikan data sampah lama yang tidak diawali format baru
      const isFormatBaru = r.request_no.startsWith('OUT-I-') || r.request_no.startsWith('IN-I-');
      if (!isFormatBaru) return false;

      // JIKA TIPE OUT: Hanya tampilkan jika statusnya pending atau approved (BUKAN DRAFT)
      if (r.type === 'OUT') {
        return r.status === 'pending' || r.status === 'approved';
      }
      
      // Jika IN, tampilkan semua
      return true;
    });

    const historyBody = document.getElementById('historyBody');
    
    if (validRequests.length === 0) {
      historyBody.innerHTML = '<tr><td colspan="6" style="text-align:center">Belum ada riwayat</td></tr>';
    } else {
      validRequests.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      
      historyBody.innerHTML = validRequests.map(r => {
        let statusBadge = '-';
        
        if (r.type === 'OUT') {
          if (r.status === 'pending') statusBadge = '<span class="badge" style="background:#fef3c7;color:#92400e;">Pending</span>';
          else if (r.status === 'approved') statusBadge = '<span class="badge" style="background:#d1fae5;color:#065f46;">Approved</span>';
        } else if (r.type === 'IN') {
          statusBadge = '<span class="badge" style="background:#dbeafe;color:#1e40af;">Received</span>';
        }

        let displayName = '-';
        if (r.type === 'OUT') displayName = r.supplier_name || '-';
        else if (r.type === 'IN') displayName = r.item && r.item.part_name ? r.item.part_name : '-';

        return `
          <tr>
            <td><strong>${r.request_no}</strong></td>
            <td>${r.type}</td>
            <td>${r.tanggal}</td>
            <td>${displayName}</td>
            <td>${statusBadge}</td>
            <td>
              ${r.type === 'OUT' && r.status === 'pending' 
                ? `<button class="btn btn-success btn-small" onclick="approve('${r.id}')">Approve</button>` 
                : (r.type === 'OUT' ? `<a href="/preview.html?id=${r.id}" class="btn btn-primary btn-small">Preview TR</a>` : '-')
              }
            </td>
          </tr>
        `;
      }).join('');
    }

    function approve(id) {
      if(!confirm('Approve dokumen ini?')) return;
      
      const reqs = JSON.parse(localStorage.getItem('requests') || '[]');
      const doc = reqs.find(r => r.id === id);
      if (doc) {
        doc.status = 'approved';
        localStorage.setItem('requests', JSON.stringify(reqs));
        location.reload();
      }
    }
  </script>
</body>
</html>
