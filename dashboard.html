<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Factory I</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🏭 Factory I — Dashboard (Testing)</h1>
  </header>

  <main class="container">
    <!-- KOTAK PESAN ERROR -->
    <div id="errorBox" style="display:none; background:#fee2e2; color:#991b1b; padding:15px; border-radius:8px; margin-bottom:20px; font-weight:bold;">
      Error: <span id="errorText"></span>
    </div>

    <div class="actions-bar">
      <h2>Dokumen Saya</h2>
      <button id="newBtn" class="btn-primary">+ Buat / Lanjut Dokumen Hari Ini</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Request No</th>
          <th>Tanggal</th>
          <th>PIC</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="reqTableBody">
        <tr><td colspan="5" style="text-align:center">Memuat data...</td></tr>
      </tbody>
    </table>
  </main>

  <script type="module">
    // PASTIKAN URL DAN KEY DI js/supabase.js SUDAH BENAR
    import { supabase } from '/js/supabase.js';

    // 1. TANGKAP ERROR JIKA SUPABASE GAGAL DIMUAT
    window.addEventListener('error', (e) => {
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('errorText').textContent = e.message;
    });

    // 2. SETUP TOMBOL LANGSUNG SAAT HALAMAN DIMUAT
    const newBtn = document.getElementById('newBtn');
    
    // Tombol ini akan selalu bisa diklik
    newBtn.onclick = () => {
      // Cek dulu apakah dokumen hari ini sudah ada
      location.href = '/form.html'; 
    };

    // 3. COBA AMBIL DATA DARI SUPABASE
    async function loadData() {
      try {
        const tbody = document.getElementById('reqTableBody');
        
        // Kita coba ambil data dari tabel requests
        const { data, error } = await supabase
          .from('requests')
          .select('id,request_no,tanggal,surindo_pic,status');

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Database kosong / Belum ada dokumen</td></tr>';
        } else {
          tbody.innerHTML = data.map(r => `
            <tr>
              <td><strong>${r.request_no}</strong></td>
              <td>${r.tanggal}</td>
              <td>${r.surindo_pic}</td>
              <td><span class="badge ${r.status}">${r.status}</span></td>
              <td><a href="/form.html?id=${r.id}" class="btn-small">Buka</a></td>
            </tr>
          `).join('');
        }
      } catch (err) {
        // Jika Supabase error, tampilkan di kotak merah
        document.getElementById('errorBox').style.display = 'block';
        document.getElementById('errorText').textContent = err.message;
        document.getElementById('reqTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center">Gagal memuat data</td></tr>';
      }
    }

    // Jalankan fungsi ambil data
    loadData();
  </script>
</body>
</html>
