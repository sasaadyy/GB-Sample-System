<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard — Factory I</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🏭 Factory I — Dashboard</h1>
  </header>

  <main class="container">
    <div class="actions-bar" style="display:flex; justify-content:space-between; margin-bottom:20px;">
      <h2 style="margin:0;">Riwayat Dokumen</h2>
      <div>
        <a href="/form-in.html" class="btn-primary" style="background:#059669;">+ Input IN</a>
        <a href="/form-out.html" class="btn-primary" style="background:#dc2626;">+ Input OUT</a>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Request No</th>
            <th>Tipe</th>
            <th>Tanggal</th>
            <th>PIC / Supplier</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="reqTableBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    let allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
    const tbody = document.getElementById('reqTableBody');

    if (allRequests.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Belum ada dokumen. Silakan buat baru.</td></tr>';
    } else {
      allRequests.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      
      tbody.innerHTML = allRequests.map(r => `
        <tr>
          <td><strong>${r.request_no}</strong></td>
          <td><span class="badge ${r.type === 'IN' ? 'in' : 'out'}">${r.type}</span></td>
          <td>${r.tanggal}</td>
          <td>${r.type === 'IN' ? r.purpose : r.supplier_name}</td>
          <td>
            <a href="/form-${r.type.toLowerCase()}.html?id=${r.id}" class="btn-small">Buka</a>
            <button class="btn-small btn-danger" onclick="hapusReq('${r.id}')">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    function hapusReq(id) {
      if (!confirm('Hapus dokumen ini?')) return;
      allRequests = allRequests.filter(r => r.id !== id);
      localStorage.setItem('requests', JSON.stringify(allRequests));
      location.reload();
    }
  </script>
</body>
</html>
