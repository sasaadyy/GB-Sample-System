<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — TR System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>Dokumen Transport Request (TR)</h1>
  </div>

  <div class="container">
    <!-- HEADER FORM -->
    <div class="form-header">
      <div class="form-group">
        <label>Request No.</label>
        <input type="text" id="searchReq" placeholder="Cari Request No..." />
      </div>
      <div class="form-group">
        <label>Surindo PIC</label>
        <input type="text" value="Darijok" readonly />
      </div>
      <button class="btn" onclick="openModal()" style="height: 30px; margin-top: 5px;">Add Data</button>
    </div>

    <!-- TAB NAV (Sesuai Figma) -->
    <div class="tabnav">
      <button class="active">Dokumen</button>
      <button>Barang</button>
      <button>Packing List</button>
    </div>

    <!-- TABEL DATA -->
    <table class="table-bottom">
      <thead>
        <tr>
          <th>Request No.</th>
          <th>Tanggal</th>
          <th>Factory Code</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="reqTableBody">
        <!-- Diisi JS -->
      </tbody>
    </table>
  </div>

  <!-- MODAL ADD DATA (Sesuai Figma Kotak Putih Tengah) -->
  <div class="modal" id="modalAdd">
    <div class="modal-content">
      <h2>Form Tambah Dokumen</h2>
      <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="addTanggal" />
      </div>
      <div class="form-group">
        <label>Factory Code</label>
        <select id="addFactory">
          <option value="I">I</option>
          <option value="II">II</option>
        </select>
      </div>
      <div class="form-group">
        <label>Surindo PIC</label>
        <select id="addPic">
          <option>Darijok</option>
          <option>Angga</option>
          <option>Vera</option>
        </select>
      </div>
      <div style="text-align: right; margin-top: 20px;">
        <button class="btn" onclick="tambahData()">Tambah</button>
        <button class="btn" onclick="closeModal()">Reset</button>
      </div>
    </div>
  </div>

  <script>
    let allRequests = JSON.parse(localStorage.getItem('requests') || '[]');

    function openModal() {
      document.getElementById('modalAdd').style.display = 'flex';
      document.getElementById('addTanggal').value = new Date().toISOString().slice(0,10);
    }

    function closeModal() {
      document.getElementById('modalAdd').style.display = 'none';
    }

    function tambahData() {
      const tgl = document.getElementById('addTanggal').value;
      const factory = document.getElementById('addFactory').value;
      const pic = document.getElementById('addPic').value;

      if (!tgl) return alert('Tanggal wajib diisi');

      const newId = 'req-' + Date.now();
      const year = new Date().getFullYear().toString().slice(-2);
      const seq = String(allRequests.length + 1).padStart(4, '0');

      const newDoc = {
        id: newId,
        request_no: `${factory}-${year}-${seq}`,
        tanggal: tgl,
        factory_code: factory,
        surindo_pic: pic,
        status: 'draft',
        items: [],
        packing: null
      };

      allRequests.push(newDoc);
      localStorage.setItem('requests', JSON.stringify(allRequests));
      
      // Lempar ke halaman form detail
      window.location.href = `/form.html?id=${newId}`;
    }

    // Render Tabel
    function renderTable() {
      const tbody = document.getElementById('reqTableBody');
      if (allRequests.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; background:#fff;">Belum ada data</td></tr>';
        return;
      }
      
      tbody.innerHTML = allRequests.map(r => `
        <tr>
          <td style="background:#fff;">${r.request_no}</td>
          <td style="background:#fff;">${r.tanggal}</td>
          <td style="background:#fff;">${r.factory_code}</td>
          <td style="background:#fff;"><span class="badge ${r.status}">${r.status}</span></td>
          <td style="background:#fff;">
            <a href="/form.html?id=${r.id}" style="color:blue; text-decoration:underline; font-size:13px;">Buka</a>
          </td>
        </tr>
      `).join('');
    }

    renderTable();
  </script>
</body>
</html>
