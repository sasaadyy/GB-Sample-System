<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Database OUT</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="sidebar">
    <h2>Factory 1</h2>
    <a href="/dashboard.html">📊 Dashboard</a>
    <a href="/input-in.html">📥 Input IN</a>
    <a href="/input-out.html" class="active">📤 Input OUT</a>
    <a href="/report.html">📑 Report</a>
    <a href="/index.html" style="margin-top: auto;">🚪 Logout</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h3>Database Barang Keluar (OUT)</h3>
    </div>
    
    <div class="container">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin: 0;">Riwayat Data OUT</h3>
          <a href="/form-out.html" class="btn btn-primary">+ Tambah Input OUT</a>
        </div>

        <table>
          <thead>
            <tr>
              <th>Request No</th>
              <th>Tanggal</th>
              <th>Supplier</th>
              <th>Total Item</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableOUTBody">
            <!-- Diisi JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
    let dataOUT = allRequests.filter(r => r.type === 'OUT');

    const tbody = document.getElementById('tableOUTBody');

    function renderTable() {
      if (dataOUT.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">Belum ada data OUT. Silakan tambah.</td></tr>';
        return;
      }

      dataOUT.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

      tbody.innerHTML = dataOUT.map(r => {
        let badge = '';
        if (r.status === 'pending') badge = '<span class="badge" style="background:#fef3c7;color:#92400e;">Pending</span>';
        else if (r.status === 'approved') badge = '<span class="badge" style="background:#d1fae5;color:#065f46;">Approved</span>';
        else badge = '<span class="badge" style="background:#e2e8f0;color:#475569;">Draft</span>';

        return `
          <tr>
            <td>${r.request_no}</td>
            <td>${r.tanggal}</td>
            <td>${r.supplier_name || '-'}</td>
            <td>${r.items ? r.items.length : 0} Barang</td>
            <td>${badge}</td>
            <td>
              ${r.status === 'pending' 
                ? `<button class="btn btn-success btn-small" onclick="approve('${r.id}')">Approve</button>` 
                : (r.status === 'approved' ? `<a href="/preview.html?id=${r.id}" class="btn btn-primary btn-small">Preview TR</a>` : '')}
              <button class="btn btn-danger btn-small" onclick="hapusOUT('${r.id}')">Hapus</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function approve(id) {
      if (!confirm('Approve dokumen ini?')) return;
      const reqs = JSON.parse(localStorage.getItem('requests') || '[]');
      const doc = reqs.find(r => r.id === id);
      if (doc) {
        doc.status = 'approved';
        localStorage.setItem('requests', JSON.stringify(reqs));
        dataOUT = reqs.filter(r => r.type === 'OUT');
        renderTable();
      }
    }

    function hapusOUT(id) {
      if (!confirm('Yakin ingin menghapus data OUT ini?')) return;
      allRequests = allRequests.filter(r => r.id !== id);
      localStorage.setItem('requests', JSON.stringify(allRequests));
      dataOUT = allRequests.filter(r => r.type === 'OUT');
      renderTable();
    }

    renderTable();
  </script>
</body>
</html>
