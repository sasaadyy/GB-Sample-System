<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Input OUT</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>📤 Input Movement GB Sample EXPORT (OUT)</h1>
    <a href="/dashboard.html">← Kembali</a>
  </header>

  <main class="container">
    <!-- HEADER INFO -->
    <div class="card" style="padding: 15px 24px; display:flex; gap: 30px; background:#e0e7ff;">
      <div><strong>Request No:</strong> <span id="reqNo">-</span></div>
      <div><strong>Tanggal:</strong> <span id="reqTgl">-</span></div>
      <div><strong>PIC:</strong> <span id="reqPic">-</span></div>
    </div>

    <!-- TAB NAV -->
    <nav class="tabnav">
      <button class="active" onclick="switchTab('dokumen', this)">1. Dokumen</button>
      <button onclick="switchTab('barang', this)">2. Barang</button>
      <button onclick="switchTab('packing', this)">3. Packing List</button>
    </nav>

    <!-- ================= TAB 1: DOKUMEN ================= -->
    <section class="card tab-content active" id="tab-dokumen">
      <h2>Data Dokumen</h2>
      <div class="grid-2">
        <div class="form-row">
          <label>PIC</label>
          <select id="outPic">
            <option value="Darijok">Darijok</option>
            <option value="Mumuh">Mumuh</option>
            <option value="Angga">Angga</option>
          </select>
        </div>
        <div class="form-row">
          <label>Date</label>
          <input type="date" id="outDate" />
        </div>
        <div class="form-row">
          <label>Id Supplier</label>
          <input type="text" id="outSuppId" value="SUM001" />
        </div>
        <div class="form-row">
          <label>Desc Supplier</label>
          <input type="text" id="outSuppDesc" value="SUMITOMO RUBBER INDUSTRIES, LTD." />
        </div>
      </div>
      <div class="form-row">
        <label>Address</label>
        <textarea id="outAddress" rows="3">Sports Business Headquarters. 1-1,2-CHOME, TSUTSUI-CHO, CHUO-KU, KOBE 651-0072, JAPAN</textarea>
      </div>
      <button class="btn-primary" onclick="simpanHeaderOUT()">Simpan Dokumen</button>
    </section>

    <!-- ================= TAB 2: BARANG ================= -->
    <section class="card tab-content" id="tab-barang">
      <h2>Data Barang</h2>
      <div class="form-row">
        <label>Category</label>
        <input type="text" id="outCategory" placeholder="Cth: OB / Ball" />
      </div>
      <div class="form-row">
        <label>Part Name</label>
        <select id="outPartName" onchange="autoFillOUT()">
          <option value="">-- Pilih Part Name --</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="form-row"><label>Part No.</label><input type="text" id="outPartNo" readonly /></div>
        <div class="form-row"><label>Core</label><input type="text" id="outCore" readonly /></div>
        <div class="form-row"><label>Resin</label><input type="text" id="outResin" readonly /></div>
        <div class="form-row"><label>Unit</label><input type="text" id="outUnit" readonly /></div>
        <div class="form-row"><label>Item</label><input type="text" id="outItem" readonly /></div>
        <div class="form-row"><label>Saldo Stock</label><input type="number" id="outSaldo" value="0" readonly /></div>
        <div class="form-row"><label>Quantity OUT</label><input type="number" id="outQty" value="0" /></div>
      </div>
      <button class="btn-primary" onclick="tambahBarangOUT()">Tambah Barang</button>
      
      <table>
        <thead>
          <tr><th>Part Name</th><th>Part No</th><th>Qty OUT</th><th>Aksi</th></tr>
        </thead>
        <tbody id="tableBarangOUT"></tbody>
      </table>
    </section>

    <!-- ================= TAB 3: PACKING LIST ================= -->
    <section class="card tab-content" id="tab-packing">
      <h2>Packing List</h2>
      <div class="grid-2">
        <div class="form-row"><label>Jumlah Box</label><input type="number" id="packBox" /></div>
        <div class="form-row"><label>Dimensi</label><input type="text" id="packDim" placeholder="40x30x20" /></div>
        <div class="form-row"><label>Gross Weight (Kg)</label><input type="number" id="packGross" /></div>
        <div class="form-row"><label>Nett Weight (Kg)</label><input type="number" id="packNett" /></div>
      </div>
      <button class="btn-primary" onclick="simpanPackingOUT()">Simpan Packing</button>
      
      <table>
        <thead>
          <tr><th>Jumlah Box</th><th>Dimensi</th><th>Gross</th><th>Nett</th></tr>
        </thead>
        <tbody id="tablePackingOUT"></tbody>
      </table>
    </section>

  </main>

  <script src="/js/masterData.js"></script>
  <script>
    const urlParams = new URLSearchParams(location.search);
    let reqId = urlParams.get('id');
    let allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
    let currentDoc = null;

    // Jika membuat baru
    if (!reqId) {
      reqId = 'req-' + Date.now();
      const year = new Date().getFullYear().toString().slice(-2);
      const seq = String(allRequests.length + 1).padStart(4, '0');
      
      currentDoc = {
        id: reqId,
        request_no: `I-${year}-${seq}`,
        type: 'OUT',
        tanggal: new Date().toISOString().slice(0,10),
        factory_code: 'I',
        surindo_pic: 'Mumuh',
        status: 'draft',
        created_at: new Date().toISOString(),
        items: [],
        packing: null
      };
      allRequests.push(currentDoc);
      localStorage.setItem('requests', JSON.stringify(allRequests));
      history.replaceState({}, '', `?id=${reqId}`);
    } else {
      currentDoc = allRequests.find(r => r.id === reqId);
    }

    // Isi Header
    document.getElementById('reqNo').textContent = currentDoc.request_no;
    document.getElementById('reqTgl').textContent = currentDoc.tanggal;
    document.getElementById('reqPic').textContent = currentDoc.surindo_pic;
    document.getElementById('outDate').value = currentDoc.tanggal;

    // Dropdown Part Name
    const sel = document.getElementById('outPartName');
    MASTER_PARTS.forEach(p => {
      sel.innerHTML += `<option value="${p.part_no}">${p.part_name}</option>`;
    });

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tabnav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function autoFillOUT() {
      const pNo = document.getElementById('outPartName').value;
      const part = MASTER_PARTS.find(p => p.part_no === pNo);
      if (part) {
        document.getElementById('outPartNo').value = part.part_no;
        document.getElementById('outCore').value = part.core;
        document.getElementById('outResin').value = part.resin;
        document.getElementById('outUnit').value = part.unit;
        document.getElementById('outItem').value = part.item;
      }
    }

    function simpanHeaderOUT() {
      currentDoc.surindo_pic = document.getElementById('outPic').value;
      currentDoc.tanggal = document.getElementById('outDate').value;
      currentDoc.supplier_name = document.getElementById('outSuppDesc').value;
      saveToLocal();
      alert('Header Dokumen disimpan!');
    }

    function tambahBarangOUT() {
      const qty = Number(document.getElementById('outQty').value);
      const pNo = document.getElementById('outPartName').value;
      if (!pNo || qty <= 0) return alert('Pilih Part dan isi Qty dengan benar');
      
      currentDoc.items.push({
        part_name: document.getElementById('outPartName').options[document.getElementById('outPartName').selectedIndex].text,
        part_no: pNo,
        unit: document.getElementById('outUnit').value,
        qty_out: qty
      });

      saveToLocal();
      renderBarangOUT();
      document.getElementById('outQty').value = '0';
    }

    function renderBarangOUT() {
      const tbody = document.getElementById('tableBarangOUT');
      if (currentDoc.items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Belum ada barang</td></tr>';
        return;
      }
      tbody.innerHTML = currentDoc.items.map((it, i) => `
        <tr>
          <td>${it.part_name}</td>
          <td>${it.part_no}</td>
          <td>${it.qty_out}</td>
          <td><button class="btn-small btn-danger" onclick="hapusBarang(${i})">Hapus</button></td>
        </tr>
      `).join('');
    }

    function hapusBarang(idx) {
      currentDoc.items.splice(idx, 1);
      saveToLocal();
      renderBarangOUT();
    }

    function simpanPackingOUT() {
      currentDoc.packing = {
        jumlah_box: document.getElementById('packBox').value,
        dimensi: document.getElementById('packDim').value,
        gross: document.getElementById('packGross').value,
        nett: document.getElementById('packNett').value
      };
      saveToLocal();
      renderPackingOUT();
      alert('Packing List disimpan!');
    }

    function renderPackingOUT() {
      const tbody = document.getElementById('tablePackingOUT');
      if (!currentDoc.packing) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Belum ada data</td></tr>';
        return;
      }
      tbody.innerHTML = `
        <tr>
          <td>${currentDoc.packing.jumlah_box}</td>
          <td>${currentDoc.packing.dimensi}</td>
          <td>${currentDoc.packing.gross}</td>
          <td>${currentDoc.packing.nett}</td>
        </tr>
      `;
    }

    function saveToLocal() {
      const idx = allRequests.findIndex(r => r.id === reqId);
      allRequests[idx] = currentDoc;
      localStorage.setItem('requests', JSON.stringify(allRequests));
    }

    // Render Awal
    renderBarangOUT();
    renderPackingOUT();
  </script>
</body>
</html>
