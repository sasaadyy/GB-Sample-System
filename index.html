<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Request - Master Data System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>📋 Form Input Request</h1>
    <nav>
      <a href="/index.html" class="active">Input</a>
      <a href="/data.html">Data Tersimpan</a>
    </nav>
  </header>

  <main class="container">
    <form id="requestForm" class="card">
      <div class="form-row">
        <label>Request Number (auto)</label>
        <input type="text" id="requestNumber" readonly />
        <button type="button" id="regenReqNum" class="btn-secondary">↻ Regenerate</button>
      </div>

      <div class="form-row">
        <label>Tanggal</label>
        <input type="date" id="tanggal" required />
      </div>

      <div class="form-row">
        <label>Movement</label>
        <select id="movement" required>
          <option value="">-- Pilih --</option>
          <option value="LOCAL">LOCAL</option>
          <option value="EXPORT">EXPORT</option>
        </select>
      </div>

      <div class="form-row">
        <label>Category</label>
        <select id="category" required>
          <option value="">-- Pilih --</option>
          <option>Final Ball</option>
          <option>Finish Ball</option>
          <option>Core Ball</option>
          <option>Packaging</option>
          <option>Mold & Spare Part Mold</option>
          <option>Carton Box</option>
          <option>Material Sample</option>
          <option>Resin</option>
          <option>Others</option>
        </select>
      </div>

      <div class="form-row">
        <label>Factory Code</label>
        <select id="factoryCode">
          <option value="">-- Pilih --</option>
          <option>I</option>
          <option>II</option>
        </select>
      </div>

      <div class="form-row">
        <label>SURINDO PIC</label>
        <select id="surindoPic">
          <option value="">-- Pilih --</option>
          <option>Darijok</option>
          <option>Angga</option>
          <option>Vera</option>
          <option>Rian</option>
          <option>Ayadi</option>
          <option>Huda</option>
          <option>Mumuh</option>
        </select>
      </div>

      <div class="form-row">
        <label>Purpose</label>
        <input type="text" id="purpose" placeholder="cth: Sample Test Paint" />
      </div>

      <hr />

      <h3>Detail Part</h3>
      <div class="form-row">
        <label>Part Name</label>
        <input type="text" id="partName" required placeholder="cth: 2P420 WH2[DL_S] (1)" />
      </div>
      <div class="form-row">
        <label>Part No</label>
        <input type="text" id="partNo" required placeholder="cth: FG15SR244B" />
      </div>
      <div class="form-row">
        <label>Core</label>
        <input type="text" id="core" />
      </div>
      <div class="form-row">
        <label>Resin</label>
        <input type="text" id="resin" />
      </div>
      <div class="form-row">
        <label>Unit</label>
        <select id="unit">
          <option>DOZEN</option>
          <option>PCS</option>
          <option>SET</option>
        </select>
      </div>
      <div class="form-row">
        <label>Item</label>
        <input type="text" id="item" placeholder="cth: GOLF BALL" />
      </div>
      <div class="form-row">
        <label>Quantity</label>
        <input type="number" id="qty" min="1" value="1" required />
      </div>

      <hr />

      <h3>Supplier / Pengirim</h3>
      <div class="form-row">
        <label>Supp_Id</label>
        <input type="text" id="suppId" placeholder="cth: SRI00002" />
      </div>
      <div class="form-row">
        <label>SuppDesc</label>
        <input type="text" id="suppDesc" />
      </div>
      <div class="form-row">
        <label>PIC_Name</label>
        <input type="text" id="picName" />
      </div>
      <div class="form-row">
        <label>Address</label>
        <textarea id="address" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label>Telp</label>
        <input type="text" id="tlp" />
      </div>
      <div class="form-row">
        <label>Fax</label>
        <input type="text" id="fax" />
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">💾 Simpan Data</button>
        <button type="reset" class="btn-secondary">Reset</button>
      </div>
    </form>
  </main>

  <script src="/js/storage.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
