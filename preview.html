<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Preview Transport Request</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    @page { size: A4; margin: 10mm; }
    @media print {
      .sidebar, .topbar, .no-print { display: none !important; }
      body { background: white; display: block; overflow: visible; }
      .main-content { overflow: visible; }
      .container { padding: 0; overflow: visible; }
      .card { box-shadow: none; border: none; }
      .doc-box { border: none !important; padding: 0 !important; max-width: none !important; }
    }
    .doc-box { max-width: 800px; margin: 0 auto; background: white; padding: 32px 36px; border: 1px solid #ccc;
               font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #000; }
    .doc-box table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .doc-box td, .doc-box th { border: 1.5px solid #000; padding: 4px 6px; vertical-align: middle; word-wrap: break-word; }
    .doc-box th { background: #d1d5db; font-weight: 700; text-align: center; }
    .lbl { font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    .to p { margin: 0 0 8px; font-size: 13px; }
    .doc-title { text-align: center; font-size: 22px; font-weight: 700; margin: 10px 0 8px; }
    .sec-title { font-weight: 700; margin: 14px 0 3px; font-size: 13px; text-transform: uppercase; }
    .c { text-align: center; }
    .items td { height: 16px; padding: 1px 6px; }
    .tot td { background: #d1d5db; font-weight: 700; text-align: center; }
    .sign-wrap { display: flex; justify-content: flex-end; margin-top: 24px; page-break-inside: avoid; }
    .sign { width: 320px; }
    .sign .space { height: 70px; }
    .sign .name { text-align: center; font-weight: 700; font-size: 13px; }
    .sign .dt { font-size: 11px; }
  </style>
</head>
<body>
  <div class="main-content" style="width:100%;">
    <div class="container">
      <div class="no-print" style="text-align:center; margin-bottom:20px;">
        <button class="btn btn-primary" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
        <a href="/dashboard.html" class="btn btn-danger">← Kembali</a>
        <span id="statusBadge" style="margin-left:15px; font-weight:bold;"></span>
      </div>

      <div class="doc-box" id="docContent"></div>
    </div>
  </div>

  <script src="/js/masterData.js"></script>
  <script>
    const urlParams = new URLSearchParams(location.search);
    const reqId = urlParams.get('id');
    const allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
    const doc = allRequests.find(r => r.id === reqId);

    const PARTS = (typeof MASTER_PARTS !== 'undefined') ? MASTER_PARTS : [];
    const SUPPS = (typeof MASTER_SUPPLIERS !== 'undefined') ? MASTER_SUPPLIERS : [];

    // ===== Nilai default (otomatis, tidak diisi di form) =====
    const DEFAULT_SECTION = 'GOLF BALL WORKS TECHNICAL FACT. #1';
    const DEFAULT_SEND_BY = 'AIR';
    const DEFAULT_CHARGE = 'SENDER';
    const APPROVER = 'Baihaqki';

    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtDate(v) {
      if (!v) return '';
      const d = new Date(v);
      if (isNaN(d)) return esc(v);
      return String(d.getDate()).padStart(2,'0') + '-' + MON[d.getMonth()] + '-' + d.getFullYear();
    }

    if (!doc) {
      document.getElementById('docContent').innerHTML = '<h2>Data tidak ditemukan</h2>';
    } else {
      document.getElementById('statusBadge').textContent = 'Status: ' + (doc.status || '').toUpperCase();

      const pic = doc.surindo_pic || 'Mumuh';
      const MAX_ITEMS = 20;
      const items = doc.items || [];
      const packing = doc.packing || [];

      // ===== Contents (max 20 baris) =====
      let itemsHtml = '';
      for (let i = 0; i < MAX_ITEMS; i++) {
        const it = items[i];
        if (it) {
          const unit = it.unit || (PARTS.find(p => p.part_no === it.part_no) || {}).unit || '';
          itemsHtml += `
            <tr>
              <td class="c">${i + 1}</td>
              <td>${esc(it.category)}</td>
              <td>${esc(it.part_name)}</td>
              <td class="c">${esc(it.qty_out)}</td>
              <td class="c">${esc(unit)}</td>
              <td>${esc(it.part_no)}</td>
            </tr>`;
        } else {
          itemsHtml += `<tr><td class="c">${i + 1}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
        }
      }

     // ===== Packing list =====
let totalGross = 0, totalNett = 0;
const packingHtml = packing.map((pk, i) => {
  const g = Number(pk.gross) || 0;
  const hasNett = pk.nett !== undefined && pk.nett !== '';
  const n = Number(pk.nett) || 0;
  totalGross += g;
  totalNett += n;
  const dim = pk.dimensi ? esc(pk.dimensi) + (/cm/i.test(pk.dimensi) ? '' : ' cm') : '';
  return `
    <tr>
      <td class="c">Box ${i + 1}</td>
      <td class="c">${g.toFixed(2)}</td>
      <td class="c">${hasNett ? n.toFixed(2) : '-'}</td>
      <td class="c">${dim}</td>
    </tr>`;
}).join('');
      // ===== Destination (nama, alamat, PIC supplier) =====
      const address = doc.supplier_address || (SUPPS.find(s => s.name === doc.supplier_name) || {}).address || '';
      const destLines = [];
      if (doc.supplier_name) destLines.push(`<strong>${esc(doc.supplier_name)}</strong>`);
      if (address) destLines.push(esc(address).replace(/\n/g, '<br>'));
      if (doc.dest_pic) destLines.push('<div style="margin-top:8px;">PIC: ' + esc(doc.dest_pic) + '</div>');

      document.getElementById('docContent').innerHTML = `
        <div class="to">
          <p><strong>TO:</strong> PURCHASING Dept.</p>
          <p><strong>From:</strong> G/B WORKS TECHNICAL</p>
        </div>

        <div class="doc-title">TRANSPORT REQUEST SHEET</div>

        <table>
          <colgroup><col style="width:19%"><col style="width:41%"><col style="width:10%"><col style="width:30%"></colgroup>
          <tr>
            <td class="lbl">Request No.</td><td>${esc(doc.request_no)}</td>
            <td class="lbl">Date</td><td>${fmtDate(doc.tanggal)}</td>
          </tr>
          <tr><td class="lbl">Request Section</td><td colspan="3">${DEFAULT_SECTION}</td></tr>
          <tr><td class="lbl">Sender</td><td colspan="3">WORKS TECHNICAL SURINDO (${esc(pic.toUpperCase())})</td></tr>
          <tr><td class="lbl" style="vertical-align:top;">The Destination</td><td colspan="3" style="height:80px; vertical-align:top;">${destLines.join('<br>') || '-'}</td></tr>
          <tr><td class="lbl">Purpose</td><td colspan="3">${esc(doc.purpose || '-')}</td></tr>
        </table>

        <div class="sec-title">Contents (max ${MAX_ITEMS} items)</div>
        <table class="items">
          <colgroup><col style="width:5%"><col style="width:16%"><col style="width:33%"><col style="width:9%"><col style="width:11%"><col style="width:26%"></colgroup>
          <thead><tr><th>No</th><th>Item</th><th>Part Name</th><th>Qty</th><th>Unit</th><th>Part Number</th></tr></thead>
          <tbody>${itemsHtml}</tbody>
        </table>

        <div class="sec-title">Packing List / Boxes (${packing.length} Box)</div>
        <table>
          <thead><tr><th>Box</th><th>Weight (kg)</th><th>Dimension (L x W x H)</th></tr></thead>
          <tbody>
            ${packingHtml}
            <tr class="tot"><td>TOTAL</td><td>${totalWeight.toFixed(2)} kg</td><td>${packing.length} Box(es)</td></tr>
          </tbody>
        </table>

        <table style="margin-top:16px;">
          <colgroup><col style="width:19%"><col style="width:81%"></colgroup>
          <tr><td class="lbl">Send By</td><td>${DEFAULT_SEND_BY}</td></tr>
          <tr><td class="lbl">Charge</td><td>${DEFAULT_CHARGE}</td></tr>
        </table>

        <div class="sign-wrap">
          <table class="sign">
            <tr><th>APPROVED</th><th>ISSUED</th></tr>
            <tr><td class="space"></td><td class="space"></td></tr>
            <tr><td class="name">${esc(doc.approved_by || APPROVER)}</td><td class="name">${esc(pic)}</td></tr>
            <tr>
              <td class="dt">Date: ${doc.approved_at ? fmtDate(doc.approved_at) : ''}</td>
              <td class="dt">Date: ${fmtDate(doc.tanggal)}</td>
            </tr>
          </table>
        </div>
      `;
    }
  </script>
</body>
</html>
