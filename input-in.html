<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Database IN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="sidebar">
    <h2>Factory 1</h2>
    <a href="/dashboard.html">📊 Dashboard</a>
    <a href="/input-in.html" class="active">📥 Input IN</a>
    <a href="/input-out.html">📤 Input OUT</a>
    <a href="/report.html">📑 Report</a>
    <a href="/index.html" style="margin-top: auto;">🚪 Logout</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h3>Database Barang Masuk (IN)</h3>
    </div>
    
    <div class="container">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin: 0;">Riwayat Data IN</h3>
          <a href="/form-in.html" class="btn btn-primary">+ Tambah Input IN</a>
        </div>

        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Kategori</th>
              <th>Part Name</th>
              <th>Part Number</th>
              <th>Qty IN</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableINBody">
            <!-- Diisi JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
    // Filter hanya tipe IN
    let dataIN = allRequests.filter(r => r.type === 'IN');

    const tbody = document.getElementById('tableINBody');

    function renderTable() {
      if (dataIN.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">Belum ada data IN. Silakan tambah.</td></tr>';
        return;
      }

      // Urutkan dari yang terbaru
      dataIN.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

      tbody.innerHTML = dataIN.map(r => `
        <tr>
          <td>${r.tanggal}</td>
          <td>${r.category}</td>
          <td>${r.item.part_name}</td>
          <td>${r.item.part_no}</td>
          <td>${r.item.qty}</td>
          <td>
            <button class="btn btn-danger btn-small" onclick="hapusIN('${r.id}')">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    function hapusIN(id) {
      if (!confirm('Yakin ingin menghapus data IN ini?')) return;
      
      // Hapus dari array utama
      allRequests = allRequests.filter(r => r.id !== id);
      localStorage.setItem('requests', JSON.stringify(allRequests));
      
      // Update dataIN dan render ulang
      dataIN = allRequests.filter(r => r.type === 'IN');
      renderTable();
    }

    // Render awal
    renderTable();
  </script>
</body>
</html>
