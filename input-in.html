<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Input IN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="sidebar">
    <h2>Factory 1</h2>
    <a href="/dashboard.html">📊 Dashboard</a>
    <a href="/input-in.html" class="active">📥 Input IN</a>
    <a href="/input-out.html">📤 Input OUT</a>
    <a href="/report.html">📑 Report</a>
    <a href="/index.html" style="margin-top: auto;">🚪 Logout</a>
  </div>
  <div class="main-content">
    <div class="topbar"><h3>Input GB Sample (IN)</h3></div>
    <div class="container">
      <div class="card">
        <h3>Data IN</h3>
        <div class="grid-2">
          <div class="form-row"><label>Tanggal</label><input type="date" id="inDate" /></div>
          <div class="form-row">
            <label>Kategori</label>
            <select id="inCat">
              <option value="Final Ball">Final Ball</option>
              <option value="Finish Ball">Finish Ball</option>
              <option value="Packaging">Packaging</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>Part Name</label>
          <select id="inPartName" onchange="autoFillIN()"><option value="">-- Pilih --</option></select>
        </div>
        <div class="grid-2">
          <div class="form-row"><label>Qty IN</label><input type="number" id="inQty" /></div>
          <div class="form-row"><label>Purpose</label><input type="text" id="inPurpose" /></div>
        </div>
        <button class="btn btn-success" onclick="simpanIN()">Simpan IN</button>
      </div>
    </div>
  </div>

  <script src="/js/masterData.js"></script>
  <script>
    const partSel = document.getElementById('inPartName');
    MASTER_PARTS.forEach(p => partSel.innerHTML += `<option value="${p.part_no}">${p.part_name}</option>`);
    document.getElementById('inDate').value = new Date().toISOString().slice(0,10);

    function autoFillIN() { /* Bisa disesuaikan */ }

    function simpanIN() {
      const qty = Number(document.getElementById('inQty').value);
      const partNo = document.getElementById('inPartName').value;
      const part = MASTER_PARTS.find(p => p.part_no === partNo);
      
      if (!part || qty <= 0) return alert('Lengkapi data!');

      const newDoc = {
        id: 'req-' + Date.now(),
        request_no: 'IN-26-' + String(Math.floor(Math.random() * 9000) + 1000),
        type: 'IN',
        tanggal: document.getElementById('inDate').value,
        category: part.category,
        purpose: document.getElementById('inPurpose').value,
        item: { part_name: part.part_name, part_no: part.part_no, qty: qty },
        created_at: new Date().toISOString()
      };

      let reqs = JSON.parse(localStorage.getItem('requests') || '[]');
      reqs.push(newDoc);
      localStorage.setItem('requests', JSON.stringify(reqs));
      
      alert('IN berhasil disimpan!');
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
