<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Database IN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="sidebar">
    <h2>Factory 1</h2>
    <a href="/dashboard.html">📊 Dashboard</a>
    <a href="/input-in.html" class="active">📥 Input IN</a>
    <a href="/input-out.html">📤 Input OUT</a>
    <a href="/report.html">📑 Report</a>
    <a href="/index.html" style="margin-top: auto;">🚪 Logout</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h3>Database Barang Masuk (IN)</h3>
    </div>
    
    <div class="container">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin: 0;">Riwayat Data IN</h3>
          <a href="/form-in.html" class="btn btn-primary">+ Tambah Input IN</a>
        </div>

        <table>
          <thead>
            <tr>
              <th>Req No / Tanggal</th>
              <th>Part Name</th>
              <th>Part Number</th>
              <th>Qty IN</th>
              <th>Unit</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableINBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
    let dataIN = allRequests.filter(r => r.type === 'IN' && r.items); // Pastikan ada items

    const tbody = document.getElementById('tableINBody');

    function renderTable() {
      if (dataIN.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">Belum ada data IN.</td></tr>';
        return;
      }

      // Urutkan dari yang terbaru
      dataIN.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

      let html = '';
      
      dataIN.forEach(doc => {
        // Looping setiap barang di dalam 1 dokumen
        doc.items.forEach((item, index) => {
          html += `
            <tr>
              <!-- Tampilkan Request No & Tanggal hanya di baris pertama -->
              <td>
                ${index === 0 ? `<strong>${doc.request_no}</strong><br><small>${doc.tanggal}</small>` : ''}
              </td>
              <td>${item.part_name}</td>
              <td>${item.part_no}</td>
              <td>${item.qty}</td>
              <td>${item.unit}</td>
              <!-- Tombol Hapus hanya muncul di baris pertama -->
              <td>
                ${index === 0 ? `<button class="btn btn-danger btn-small" onclick="hapusIN('${doc.id}')">Hapus Dokumen</button>` : ''}
              </td>
            </tr>
          `;
        });
        
        // Tambahkan garis pemisah antar dokumen
        html += `<tr><td colspan="6" style="border-bottom: 2px solid #e2e8f0;"></td></tr>`;
      });

      tbody.innerHTML = html;
    }

    function hapusIN(id) {
      if (!confirm('Yakin ingin menghapus seluruh dokumen IN ini?')) return;
      
      allRequests = allRequests.filter(r => r.id !== id);
      localStorage.setItem('requests', JSON.stringify(allRequests));
      
      dataIN = allRequests.filter(r => r.type === 'IN' && r.items);
      renderTable();
    }

    renderTable();
  </script>
</body>
</html>
