<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Database IN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="sidebar">
    <h2>Factory 1</h2>
    <a href="/dashboard.html">📊 Dashboard</a>
    <a href="/input-in.html" class="active">📥 Input IN</a>
    <a href="/input-out.html">📤 Input OUT</a>
    <a href="/report.html">📑 Report</a>
    <a href="/index.html" style="margin-top: auto;">🚪 Logout</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h3>Database Barang Masuk (IN)</h3>
    </div>

    <div class="container">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin: 0;">Riwayat Data IN</h3>
          <a href="/form-in.html" class="btn btn-primary">+ Tambah Input IN</a>
        </div>

        <table>
          <thead>
            <tr>
              <th>Doc Number</th>
              <th>Tanggal</th>
              <th>PIC</th>
              <th>Part Name</th>
              <th>Jumlah</th>
              <th>Unit</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tbodyIN"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function renderTabel() {
      const all = JSON.parse(localStorage.getItem('requests') || '[]');
      const docs = all
        .filter(r => r.type === 'IN')
        .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '') || (b.request_no || '').localeCompare(a.request_no || ''));

      const tbody = document.getElementById('tbodyIN');

      if (docs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center">Belum ada data IN</td></tr>';
        return;
      }

      tbody.innerHTML = docs.map(r => {
        // Support format baru (items[]) dan format lama (item tunggal)
        const items = r.items || (r.item ? [r.item] : []);
        const span = Math.max(items.length, 1);
        const topBorder = 'border-top: 2px solid #e2e8f0;';

        if (items.length === 0) {
          return `
            <tr>
              <td style="${topBorder}"><strong>${esc(r.request_no)}</strong></td>
              <td style="${topBorder}">${esc(r.tanggal)}</td>
              <td style="${topBorder}">${esc(r.surindo_pic || '-')}</td>
              <td colspan="3" style="${topBorder} text-align:center">-</td>
              <td style="${topBorder}"><button class="btn btn-danger btn-small" onclick="hapusDokumen('${esc(r.id)}')">Hapus Dokumen</button></td>
            </tr>`;
        }

        return items.map((it, i) => `
          <tr>
            ${i === 0 ? `
              <td rowspan="${span}" style="${topBorder} vertical-align: top;"><strong>${esc(r.request_no)}</strong></td>
              <td rowspan="${span}" style="${topBorder} vertical-align: top;">${esc(r.tanggal)}</td>
              <td rowspan="${span}" style="${topBorder} vertical-align: top;">${esc(r.surindo_pic || '-')}</td>
            ` : ''}
            <td style="${i === 0 ? topBorder : ''}">${esc(it.part_name)}</td>
            <td style="${i === 0 ? topBorder : ''}">${esc(it.qty)}</td>
            <td style="${i === 0 ? topBorder : ''}">${esc(it.unit)}</td>
            ${i === 0 ? `
              <td rowspan="${span}" style="${topBorder} vertical-align: top;">
                <button class="btn btn-danger btn-small" onclick="hapusDokumen('${esc(r.id)}')">Hapus Dokumen</button>
              </td>
            ` : ''}
          </tr>
        `).join('');
      }).join('');
    }

    function hapusDokumen(id) {
      if (!confirm('Hapus dokumen ini? Saldo stok akan ikut berkurang.')) return;
      let all = JSON.parse(localStorage.getItem('requests') || '[]');
      all = all.filter(r => r.id !== id);
      localStorage.setItem('requests', JSON.stringify(all));
      renderTabel();
    }

    renderTabel();
  </script>
</body>
</html>
